<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="570" viewBox="0 0 1600 570" role="img" aria-labelledby="title desc"><title id="title">Template lifecycle — register preview lease release</title><desc id="desc">Vector lifecycle shows a schematic first registered, previewed, provisioned for a match, then released; source file remains unchanged.</desc>
<rect x="0" y="0" width="1600" height="570" rx="0" fill="#0D1017"/><rect x="64" y="45" width="1500" height="487" rx="7" fill="#02040A" opacity=".7"/><rect x="50" y="28" width="1500" height="487" rx="7" fill="#1B202A" stroke="#47465A" stroke-width="2"/><line x1="52" y1="30" x2="1548" y2="30" stroke="#BCA2EF" stroke-width="3" opacity=".67"/><text x="100" y="105" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="750" fill="#B8A0EA" letter-spacing="2">01  /  TEMPLATE LIFECYCLE</text><text x="97" y="168" font-family="Inter, Arial, Helvetica, sans-serif" font-size="46" font-weight="760" fill="#F8F7FC" letter-spacing="-1.6">One source. Independent sessions.</text><text x="99" y="207" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="440" fill="#C9D2E0">A registered schematic becomes a managed temporary world only when requested.</text><line x1="100" y1="245" x2="1495" y2="245" stroke="#47465A" stroke-width="1"/><circle cx="131" cy="309" r="24" fill="#38314E" stroke="#BCA2EF" stroke-width="2"/><text x="131" y="317" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="760" fill="#B8A0EA" text-anchor="middle">01</text><line x1="161" y1="309" x2="419" y2="309" stroke="#594F70" stroke-width="2"/><path d="M408 302 L419 309 L408 316" fill="none" stroke="#BCA2EF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="101" y="383" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="760" fill="#F8F7FC" letter-spacing="1.2">REGISTER</text><text x="101" y="418" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="440" fill="#C9D2E0">Validate a .schem</text><text x="101" y="443" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="440" fill="#C9D2E0">and retain its source.</text><circle cx="486" cy="309" r="24" fill="#38314E" stroke="#BCA2EF" stroke-width="2"/><text x="486" y="317" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="760" fill="#B8A0EA" text-anchor="middle">02</text><line x1="516" y1="309" x2="774" y2="309" stroke="#594F70" stroke-width="2"/><path d="M763 302 L774 309 L763 316" fill="none" stroke="#BCA2EF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="456" y="383" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="760" fill="#F8F7FC" letter-spacing="1.2">PREVIEW</text><text x="456" y="418" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="440" fill="#C9D2E0">Inspect bounds and</text><text x="456" y="443" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="440" fill="#C9D2E0">relative spawn points.</text><circle cx="841" cy="309" r="24" fill="#38314E" stroke="#BCA2EF" stroke-width="2"/><text x="841" y="317" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="760" fill="#B8A0EA" text-anchor="middle">03</text><line x1="871" y1="309" x2="1129" y2="309" stroke="#594F70" stroke-width="2"/><path d="M1118 302 L1129 309 L1118 316" fill="none" stroke="#BCA2EF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="811" y="383" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="760" fill="#F8F7FC" letter-spacing="1.2">LEASE</text><text x="811" y="418" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="440" fill="#C9D2E0">Prepare a unique</text><text x="811" y="443" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="440" fill="#C9D2E0">world for the match.</text><circle cx="1196" cy="309" r="24" fill="#38314E" stroke="#BCA2EF" stroke-width="2"/><text x="1196" y="317" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="760" fill="#B8A0EA" text-anchor="middle">04</text><text x="1166" y="383" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="760" fill="#F8F7FC" letter-spacing="1.2">RELEASE</text><text x="1166" y="418" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="440" fill="#C9D2E0">Evacuate, unload</text><text x="1166" y="443" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="440" fill="#C9D2E0">then unload and clean up.</text><text x="1488" y="470" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="650" fill="#B8A0EA" letter-spacing="1.4" text-anchor="end">SOURCE FILE STAYS INTACT</text></svg>
