<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="530" viewBox="0 0 1600 530" role="img" aria-labelledby="title desc"><title id="title">World management tools</title><desc id="desc">Technical illustration of world operations in VWorld, including importing, loading, forking and configurable rules; not an in-game screenshot.</desc>
<rect x="0" y="0" width="1600" height="530" rx="0" fill="#0D1017"/><rect x="64" y="42" width="1500" height="450" rx="7" fill="#02040A" opacity=".7"/><rect x="50" y="25" width="1500" height="450" rx="7" fill="#1B202A" stroke="#47465A" stroke-width="2"/><line x1="52" y1="27" x2="1548" y2="27" stroke="#BCA2EF" stroke-width="3" opacity=".67"/><text x="102" y="105" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="750" fill="#BCA2EF" letter-spacing="2">03  /  WORLD MANAGEMENT</text><text x="99" y="161" font-family="Inter, Arial, Helvetica, sans-serif" font-size="43" font-weight="760" fill="#F9F7FC" letter-spacing="-1">More than a minigame provider.</text><text x="102" y="208" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="450" fill="#B7BBC8">Create and manage permanent worlds alongside short-lived sessions.</text><line x1="101" y1="245" x2="1496" y2="245" stroke="#47465A" stroke-width="1"/><text x="110" y="290" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="730" fill="#BCA2EF" letter-spacing="1.2">WORLDS</text><text x="355" y="290" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="440" fill="#B7BBC8">Create  /  Import  /  Load  /  Unload</text><text x="110" y="333" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="730" fill="#7BCFBE" letter-spacing="1.2">TEMPLATES</text><text x="355" y="333" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="440" fill="#B7BBC8">Fork an unloaded source world</text><text x="110" y="376" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="730" fill="#BCA2EF" letter-spacing="1.2">PLAYER ROUTES</text><text x="355" y="376" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="440" fill="#B7BBC8">Teleport and set world spawns</text><text x="110" y="419" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="730" fill="#7BCFBE" letter-spacing="1.2">WORLD RULES</text><text x="355" y="419" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="440" fill="#B7BBC8">Weather  /  Time  /  Gamerules</text><line x1="1000" y1="271" x2="1000" y2="440" stroke="#47465A" stroke-width="1"/><text x="1050" y="298" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="740" fill="#8F92A6" letter-spacing="1.3">TWO KINDS OF WORLDS</text><text x="1050" y="342" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="660" fill="#F9F7FC">Original worlds</text><text x="1050" y="374" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="660" fill="#BCA2EF">Live game sessions</text><text x="1050" y="406" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="660" fill="#7BCFBE">One management layer</text></svg>
