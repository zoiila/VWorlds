<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="548" viewBox="0 0 1600 548" role="img" aria-labelledby="title desc"><title id="title">Owned worlds, protected sources</title><desc id="desc">Technical safety diagram separating permanent source data from temporary owned session worlds, with arrows for safe lifecycle and cleanup.</desc>
<rect x="0" y="0" width="1600" height="548" rx="0" fill="#0B1117"/><rect x="64" y="42" width="1500" height="468" rx="7" fill="#070C12" opacity=".7"/><rect x="50" y="25" width="1500" height="468" rx="7" fill="#171E27" stroke="#43515B" stroke-width="2"/><line x1="52" y1="27" x2="1548" y2="27" stroke="#9CDBCF" stroke-width="3" opacity=".67"/><text x="102" y="105" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="750" fill="#EDC98A" letter-spacing="2">02  /  OWNERSHIP &amp; SAFETY</text><text x="101" y="163" font-family="Inter, Arial, Helvetica, sans-serif" font-size="37" font-weight="750" fill="#F2F4F1" letter-spacing="-1">Make worlds temporary. Keep sources permanent.</text><line x1="101" y1="200" x2="1495" y2="200" stroke="#43515B" stroke-width="1"/><text x="116" y="251" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="760" fill="#EDC98A" letter-spacing="1.7">SAVED SOURCE</text><text x="858" y="251" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="760" fill="#9CDBCF" letter-spacing="1.7">OWNED SESSION</text><rect x="112" y="276" width="553" height="126" rx="5" fill="#202931" stroke="#59606A" stroke-width="2"/><rect x="136" y="300" width="64" height="75" rx="4" fill="#334039" stroke="#80755C" stroke-width="1.2"/><path d="M148 318 L166 308 L188 318 L168 330 Z" fill="#40554B" stroke="#EDC98A" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M148 318 L148 352 L168 363 L168 330" fill="#2B3F3B" stroke="#849AA0" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="221" y="324" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="720" fill="#F2F4F1" letter-spacing="0.6">REGISTERED TEMPLATE</text><text x="221" y="353" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="470" fill="#B8C4C6">Original .schem stays unchanged</text><text x="221" y="381" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#EDC98A">File integrity checked before use</text><path d="M688 344 H811 M797 334 L812 344 L797 354" fill="none" stroke="#9CDBCF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="836" y="276" width="652" height="126" rx="5" fill="#203232" stroke="#547269" stroke-width="2"/><rect x="860" y="301" width="65" height="74" rx="4" fill="#2C4B46" stroke="#5C9686" stroke-width="1.2"/><path d="M868 315 L892 301 L916 315 L892 329 Z" fill="#39685C" stroke="#9CDBCF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M868 315 V350 L892 363 V329" fill="#24463E" stroke="#9CDBCF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="952" y="326" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="720" fill="#F2F4F1" letter-spacing="0.5">MATCH-OWNED WORLD</text><text x="952" y="354" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="470" fill="#B8C4C6">Lease tracked by an owner and state</text><text x="952" y="382" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#9CDBCF">Unsafe cleanup is retained for retry</text><text x="115" y="455" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="450" fill="#B8C4C6">Never delete unknown or unowned worlds.</text><text x="1484" y="455" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#EDC98A" letter-spacing="1.3" text-anchor="end">RELEASE  /  RECOVER  /  PROTECT</text></svg>
