<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="548" viewBox="0 0 1600 548" role="img" aria-labelledby="title desc"><title id="title">Owned worlds, protected sources</title><desc id="desc">Technical safety diagram separating permanent source data from temporary owned session worlds, with arrows for safe lifecycle and cleanup.</desc>
<rect x="0" y="0" width="1600" height="548" rx="0" fill="#0D1017"/><rect x="64" y="42" width="1500" height="468" rx="7" fill="#02040A" opacity=".7"/><rect x="50" y="25" width="1500" height="468" rx="7" fill="#1B202A" stroke="#47465A" stroke-width="2"/><line x1="52" y1="27" x2="1548" y2="27" stroke="#BCA2EF" stroke-width="3" opacity=".67"/><text x="102" y="105" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="750" fill="#7BCFBE" letter-spacing="2">02  /  OWNERSHIP &amp; SAFETY</text><text x="101" y="163" font-family="Inter, Arial, Helvetica, sans-serif" font-size="37" font-weight="750" fill="#F9F7FC" letter-spacing="-1">Make worlds temporary. Keep sources permanent.</text><line x1="101" y1="219" x2="1495" y2="219" stroke="#47465A" stroke-width="1"/><text x="116" y="251" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="760" fill="#7BCFBE" letter-spacing="1.7">SAVED SOURCE</text><text x="858" y="251" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="760" fill="#BCA2EF" letter-spacing="1.7">OWNED SESSION</text><rect x="112" y="276" width="553" height="126" rx="5" fill="#292C39" stroke="#575064" stroke-width="2"/><rect x="136" y="300" width="64" height="75" rx="4" fill="#393848" stroke="#6B6478" stroke-width="1.2"/><path d="M148 318 L166 308 L188 318 L168 330 Z" fill="#47435C" stroke="#7BCFBE" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M148 318 L148 352 L168 363 L168 330" fill="#393949" stroke="#8F92A6" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="221" y="324" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="720" fill="#F9F7FC" letter-spacing="0.6">REGISTERED TEMPLATE</text><text x="221" y="353" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="470" fill="#B7BBC8">Original .schem stays unchanged</text><text x="221" y="381" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#7BCFBE">File integrity checked before use</text><path d="M688 344 H811 M797 334 L812 344 L797 354" fill="none" stroke="#BCA2EF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="836" y="276" width="652" height="126" rx="5" fill="#272B3B" stroke="#64557F" stroke-width="2"/><rect x="860" y="301" width="65" height="74" rx="4" fill="#3C3A59" stroke="#8973AF" stroke-width="1.2"/><path d="M868 315 L892 301 L916 315 L892 329 Z" fill="#514566" stroke="#BCA2EF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M868 315 V350 L892 363 V329" fill="#34354D" stroke="#BCA2EF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="952" y="326" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="720" fill="#F9F7FC" letter-spacing="0.5">MATCH-OWNED WORLD</text><text x="952" y="354" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="470" fill="#B7BBC8">Lease tracked by an owner and state</text><text x="952" y="382" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#BCA2EF">Unsafe cleanup is retained for retry</text><text x="115" y="455" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="450" fill="#B7BBC8">Never delete unknown or unowned worlds.</text><text x="1484" y="455" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#7BCFBE" letter-spacing="1.3" text-anchor="end">RELEASE  /  RECOVER  /  PROTECT</text></svg>
